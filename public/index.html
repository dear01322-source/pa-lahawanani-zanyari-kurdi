
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پاڵەوانانی زانیاری کوردی</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#07152d,#142b50,#07152d);
 color:white;
 min-height:100vh;
}
header{text-align:center;padding:25px 10px}
header h1{color:#ffd34e;font-size:29px}
header p{color:#cbd5e1}
.container{max-width:650px;margin:auto;padding:15px}
.panel{
 background:#172b49;
 border:1px solid #385273;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 8px 25px #0004;
}
h2{color:#ffd34e;margin-top:0}
input,select,button{
 width:100%;padding:13px;margin:7px 0;
 border:0;border-radius:10px;font-size:16px;
}
input,select{background:#f1f5f9;color:#111}
button{
 background:#eabf36;color:#14213d;
 font-weight:bold;cursor:pointer;
}
button:hover{background:#ffdc64}
.games{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}
.game{
 background:#233e60;
 border:2px solid #456080;
 border-radius:14px;
 padding:17px 5px;
 text-align:center;
 cursor:pointer;
}
.game.active{border-color:#ffd34e;background:#34577d}
.game span{font-size:30px;display:block;margin-bottom:8px}
.hidden{display:none}
#status{color:#ffd34e;text-align:center}
#players{padding:0;list-style:none}
#players li{
 background:#294565;
 padding:10px;border-radius:8px;margin:6px 0;
}
#messages{
 height:150px;overflow-y:auto;
 background:#0b1a30;border-radius:10px;
 padding:10px;margin-bottom:8px;
}
.question{
 font-size:21px;text-align:center;
 margin:20px 0;
}
.answer{background:#294c72;color:white}
.answer:disabled{opacity:.6}
.small{font-size:13px;color:#cbd5e1}
</style>
</head>
<body>

<header>
<h1>🏆 پاڵەوانانی زانیاری کوردی</h1>
<p>یاری بکە، خاڵ کۆبکەرەوە و ببە بە پاڵەوان!</p>
</header>

<div class="container">

<div class="panel" id="home">
<h2>🎮 بەخێربێیت</h2>
<input id="playerName" placeholder="ناوی یاریزان">
<h2>جۆری یاری هەڵبژێرە</h2>

<div class="games">
<div class="game active" data-game="quiz">
<span>🧠</span>پرسیار
</div>
<div class="game" data-game="billiards">
<span>🎱</span>بیلیارد
</div>
<div class="game" data-game="konkani">
<span>🃏</span>کۆنکانی
</div>
</div>
<div class="game" data-game="school">
<span>🏫</span>یاری قوتابخانە
</div>
<label>ژمارەی یاریزان</label>
<select id="maxPlayers">
<option value="2">٢ یاریزان</option>
<option value="3">٣ یاریزان</option>
<option value="4">٤ یاریزان</option>
</select>

<button id="createBtn">دروستکردنی ژووری یاری</button>

<hr>
<h2>پەیوەستن بە ژوورێک</h2>
<input id="roomCode" placeholder="کۆدی ژوور">
<button id="joinBtn">چوونە ناو ژوور</button>
<p id="status">پەیوەندی چاوەڕێ دەکات...</p>
</div>

<div class="panel hidden" id="room">
<h2>🏠 ژووری یاری</h2>
<p>کۆدی ژوور:</p>
<h1 id="roomCodeDisplay" style="color:#ffd34e;text-align:center"></h1>
<button id="copyBtn">کۆپی کردنی کۆدی ژوور</button>
<p id="gameName"></p>
<h3>👥 یاریزانەکان</h3>
<ul id="players"></ul>
<p id="playerCount"></p>
<div id="gameArea"></div>
<button id="startBtn">دەستپێکردنی یاری</button>
</div>

<div class="panel hidden" id="chatPanel">
<h2>💬 گفتوگۆی یاریزانان</h2>
<div id="messages"></div>
<input id="chatInput" placeholder="نامەکەت بنووسە">
<button id="sendBtn">ناردن</button>
</div>

</div>

<script>
const socket = io();

let selectedGame = "quiz";
let currentRoom = null;
let currentGame = null;
let questions = [];
let questionIndex = 0;
let score = 0;

const $ = id => document.getElementById(id);

const questionBank = [
 {q:"پایتەختی کوردستان چییە؟",a:["هەولێر","سلێمانی","دهۆک"],c:0},
 {q:"چەند ڕۆژ لە هەفتەدا هەیە؟",a:["٥","٧","٩"],c:1},
 {q:"گۆی زەوی چەند مانگی هەیە؟",a:["١٠","١٢","١٤"],c:1},
 {q:"کام ئاژەڵ بە پاشای ئاژەڵان ناسراوە؟",a:["شێر","ئەسپ","مەڕ"],c:0},
 {q:"خۆر لە کوێ هەڵدێت؟",a:["ڕۆژئاوا","ڕۆژهەڵات","باشوور"],c:1},
 {q:"٢ + ٣ دەکاتە چەند؟",a:["٤","٥","٦"],c:1},
 {q:"کامەیان ڕەنگی ئاسمانە؟",a:["شین","سوور","ڕەش"],c:0},
 {q:"چەند پەنجە لە دەستێکی مرۆڤدا هەیە؟",a:["٤","٥","٦"],c:1}
];

document.querySelectorAll(".game").forEach(el=>{
 el.onclick=()=>{
  document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  selectedGame=el.dataset.game;
 };
});

function playerName(){
 return $("playerName").value.trim() || "یاریزان";
}

$("createBtn").onclick=()=>{
 socket.emit("create-room",{
  game:selectedGame,
  maxPlayers:Number($("maxPlayers").value),
  name:playerName()
 });
};

$("joinBtn").onclick=()=>{
 const roomId=$("roomCode").value.trim();
 if(!roomId)return alert("تکایە کۆدی ژوور بنووسە");
 socket.emit("join-room",{roomId,name:playerName()});
};

socket.on("connect",()=>{
 $("status").textContent="🟢 پەیوەندی بە سێرڤەرەوە هەیە";
});

socket.on("disconnect",()=>{
 $("status").textContent="🔴 پەیوەندی پچڕا";
});

socket.on("error-message",msg=>alert(msg));

socket.on("room-joined",data=>{
 currentRoom=data.roomId;
 currentGame=data.game;
 $("home").classList.add("hidden");
 $("room").classList.remove("hidden");
 $("chatPanel").classList.remove("hidden");
 $("roomCodeDisplay").textContent=data.roomId;
 $("gameName").textContent="جۆری یاری: "+data.game;
 updatePlayers(data.players,data.maxPlayers);
});

socket.on("players-update",players=>{
 updatePlayers(players);
});

function updatePlayers(players,max){
 $("players").innerHTML="";
 players.forEach((p,i)=>{
  const li=document.createElement("li");
  li.textContent=(i+1)+". "+p.name;
  $("players").appendChild(li);
 });
 $("playerCount").textContent="یاریزان: "+players.length+(max?" / "+max:"");
}

$("copyBtn").onclick=async()=>{
 try{
  await navigator.clipboard.writeText(currentRoom);
  alert("کۆدی ژوور کۆپی کرا!");
 }catch(e){
  alert("کۆدی ژوور: "+currentRoom);
 }
};

socket.on("school-question",data=>{
 const area=$("gameArea");
 area.innerHTML="";

 const title=document.createElement("h2");
 title.textContent="🏫 پرسیاری قوتابخانە "+data.number+" / "+data.total;
 area.appendChild(title);

 const question=document.createElement("div");
 question.className="question";
 question.textContent=data.question;
 area.appendChild(question);

 data.answers.forEach((answer,index)=>{
  const btn=document.createElement("button");
  btn.className="answer";
  btn.textContent=answer;
  btn.onclick=()=>{
   area.querySelectorAll("button").forEach(b=>b.disabled=true);
   socket.emit("school-answer",index);
  };
  area.appendChild(btn);
 });
});

socket.on("school-answer-result",data=>{
 const result=document.createElement("h3");
 result.textContent=data.correct
  ? "✅ وەڵامی ڕاست! +١ خاڵ"
  : "❌ وەڵامی هەڵە! وەڵامی ڕاست: "+data.rightAnswer;
 $("gameArea").appendChild(result);
});

socket.on("school-scores",scores=>{
 $("playerCount").textContent="🏆 خاڵەکان: "+
 Object.values(scores).reduce((a,b)=>a+b,0);
});

socket.on("school-finished",results=>{
 const area=$("gameArea");
 area.innerHTML="<h2>🏆 یاری قوتابخانە تەواو بوو!</h2>";

 results.forEach((p,i)=>{
  const item=document.createElement("h3");
  item.textContent=(i+1)+". "+p.name+
   " — "+p.score+" خاڵ — پلە "+p.level;
  area.appendChild(item);
 });

 const winner=document.createElement("h2");
 winner.textContent=results.length
  ? "👑 پاڵەوان: "+results[0].name
  : "یاری تەواو بوو";
 area.appendChild(winner);
});


function startQuiz(){
 questions=[...questionBank].sort(()=>Math.random()-.5);
 questionIndex=0;
 score=0;
 showQuestion();
}

function showQuestion(){
 const area=$("gameArea");
 if(questionIndex>=questions.length){
  area.innerHTML="<h2>🏆 یاری تەواو بوو!</h2><h1>خاڵەکانت: "+score+"</h1>";
  return;
 }

 const q=questions[questionIndex];
 area.innerHTML="";
 const title=document.createElement("h2");
 title.textContent="پرسیار "+(questionIndex+1)+" / "+questions.length;
 const question=document.createElement("div");
 question.className="question";
 question.textContent=q.q;
 area.append(title,question);

 q.a.forEach((answer,i)=>{
  const btn=document.createElement("button");
  btn.className="answer";
  btn.textContent=answer;
  btn.onclick=()=>{
   const correct=i===q.c;
   if(correct){
    score++;
    socket.emit("answer",{correct:true});
   }
   [...area.querySelectorAll("button")].forEach(b=>b.disabled=true);
   const result=document.createElement("h3");
   result.textContent=correct?"✅ وەڵامی ڕاست!":"❌ وەڵامەکە هەڵە بوو";
   area.appendChild(result);
   const next=document.createElement("button");
   next.textContent="پرسیاری داهاتوو";
   next.onclick=()=>{
    questionIndex++;
    showQuestion();
   };
   area.appendChild(next);
  };
  area.appendChild(btn);
 });
}

socket.on("score",scores=>{
 const myScore=scores[socket.id]||0;
 $("playerCount").textContent+=" | خاڵی تۆ: "+myScore;
});

$("sendBtn").onclick=sendMessage;
$("chatInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function sendMessage(){
 const input=$("chatInput");
 const message=input.value.trim();
 if(!message)return;
 socket.emit("chat",message);
 input.value="";
}

socket.on("chat",data=>{
 const div=document.createElement("div");
 div.textContent=data.player.slice(0,5)+": "+data.message;
 $("messages").appendChild(div);
 $("messages").scrollTop=$("messages").scrollHeight;
});
</script>
</body>
</html>
